<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Manage Records &middot; Museum Management
  </title>
  <link href="/css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <main id="content">
   <h1 id="pageTitle">
    Manage records
   </h1>
   <p class="subtitle" id="pageIntro">
    Add, modify and manage museum records.
   </p>
   <div class="card" id="editor">
    <h2 id="formTitle">
     Add record
    </h2>
    <form id="recordForm">
     <div class="gridform" id="fields">
     </div>
     <div class="formfooter">
      <button class="btn" id="saveButton" type="submit">
       Save record
      </button>
      <button class="btn secondary" id="cancelButton" type="button">
       Cancel edit
      </button>
     </div>
    </form>
    <p aria-live="polite" id="formStatus">
    </p>
   </div>
   <div
    id="maintenanceAlert"
    class="notice error hidden"
    role="status"
    aria-live="polite">
</div>
   <div class="card">
    <h2>
     Records
    </h2>
    <div class="tablewrap">
     <table>
      <thead>
       <tr id="tableHead">
       </tr>
      </thead>
      <tbody id="recordRows">
      </tbody>
     </table>
    </div>
    <p aria-live="polite" id="listStatus">
    </p>
   </div>

<!-- Artwork Maintenance Work Orders -->
<section id="maintenanceOrders" class="card hidden">
  <h2>Artwork Maintenance Work Orders</h2>

  <p class="muted">
    Automatically created when an artwork requires
    maintenance and updated when maintenance is completed.
  </p>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Work Order</th>
          <th>Artwork</th>
          <th>Reported At</th>
          <th>Resolved At</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="maintenanceOrderRows"></tbody>
    </table>
  </div>

  <p id="maintenanceOrderStatus" aria-live="polite"></p>
</section>

  </main>
  <script defer="" src="/js/common.js">
  </script>
  <script defer="" src="/js/manage.js">
  </script>
 </body>
</html>
