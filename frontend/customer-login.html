<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Sign In — Museum</title><link rel="stylesheet" href="/css/styles.css"></head>
<body data-customer-page="login"><main class="login-wrap"><section class="login-card">
<h1>Customer Sign In</h1><p>New visitor? <a href="/customer-register.html">Create an account</a>.</p>
<form id="customerLoginForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn" type="submit">Sign in</button></form>
<p id="customerMessage" aria-live="polite"></p><p><a href="/landing.html">Back to museum</a></p>
</section></main><script defer src="/js/customer.js"></script></body></html>
