<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Museum Sign In
  </title>
  <link href="/css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="login-wrap">
   <main class="login-card">
    <span class="pill">
     COSC 3380 &middot; Team 4
    </span>
    <h1 style="margin-top:14px">
     Museum Sign In
    </h1>
    <p class="muted">
     Sign in to your museum account.
    </p>
    <p class="muted">* indicates a required field.</p>
    <form id="loginForm">
     <div class="field">
      <label for="identifier">Username or Email *</label>
<input
    id="identifier"
    type="text"
    autocomplete="username"
    autocapitalize="none"
    spellcheck="false"
    maxlength="254"
    required
/>
     </div>
     <div class="field">
      <label for="password">
       Password
      *</label>
      <input autocomplete="current-password" id="password" required="" type="password"/>
     </div>
     <button class="btn" style="width:100%" type="submit">
      Sign in
     </button>
    </form>
    <p class="muted">
    New visitor?
    <a href="/customer-register.html">Create a customer account</a>.
    <a href="/landing.html">Browse exhibitions</a>.
</p>
    <p aria-live="polite" id="message">
    </p>
   </main>
  </div>
  <script defer="" src="/js/login.js">
  </script>
 </body>
</html>
